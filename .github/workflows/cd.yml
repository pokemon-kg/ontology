on:
  push:
    branches:
      - 'develop'
      - 'feature/*'
name: CD of the ontology
jobs:

  validate-ontology:
    uses: ./.github/workflows/validate.yml
  
  # get-release-version:
  #   name: Get release version
  #   runs-on: ubuntu-latest
  #   steps:
  #     - name: Extract release version
  #       run: |
  #         export RELEASE_VERSION=$(echo "$GITHUB_REF" | grep -Eo "[0-9.]+$")
  #         export RELEASE_VERSION=${RELEASE_VERSION:-nightly}
  #         echo "Extracted version: ${RELEASE_VERSION}"
  #         echo "RELEASE_VERSION=${RELEASE_VERSION}" >> $GITHUB_ENV

  deploy-ontology:
    uses: ./.github/workflows/deploy.yml
    needs: [validate-ontology]
    with:
      RELEASE_VERSION: nightly
      POKEMONKG_ORG_FTP_URL: ${{ vars.POKEMONKG_ORG_FTP_URL }}
      POKEMONKG_ORG_FTP_PORT: ${{ vars.POKEMONKG_ORG_FTP_PORT }}
    secrets:
      POKEMONKG_ORG_FTP_USERNAME: ${{ secrets.POKEMONKG_ORG_FTP_USERNAME }}
      POKEMONKG_ORG_FTP_PASSWORD: ${{ secrets.POKEMONKG_ORG_FTP_PASSWORD }}
